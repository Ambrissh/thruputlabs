<section class="contact-section" id="contact" aria-labelledby="contact-title">
<div class="terminal-shell" data-reveal data-contact-email="">
<div class="terminal-top"><span>thruput@labs: ~/new-project</span><a href="#top" aria-label="Back to top">↑</a></div>
<div class="terminal-body"><div class="terminal-intro"><div class="terminal-command" aria-hidden="true"><span>$</span> ./start-project<span class="terminal-caret">_</span></div><h2 id="contact-title">Have a project?<br><span>Let’s talk.</span></h2><p>Tell us what should work better—or be easier to find.</p></div>
<div class="terminal-session">
<form id="contact-form"><div class="terminal-fields"><div class="terminal-field"><label for="contact-name"><span aria-hidden="true">&gt;</span> name</label><input id="contact-name" name="name" type="text" autocomplete="name" placeholder="Your name" required maxlength="100"></div><div class="terminal-field"><label for="contact-email"><span aria-hidden="true">&gt;</span> email</label><input id="contact-email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required maxlength="254" spellcheck="false"></div><div class="terminal-field terminal-field-project"><label for="contact-project"><span aria-hidden="true">&gt;</span> project</label><textarea data-lenis-prevent id="contact-project" name="project" placeholder="A workflow, a new tool, or better visibility in AI answers. What should we improve?" rows="4" maxlength="3000" required></textarea></div></div><p id="contact-error" class="terminal-message" role="alert"></p><div class="terminal-actions"><button id="contact-copy" type="button" hidden>copy brief</button><button id="contact-submit" type="submit">copy project brief ↵</button></div><p id="contact-result" class="terminal-message" role="status"></p><pre data-lenis-prevent id="contact-brief" tabindex="0" hidden></pre></form>
</div></div></div>
</section>
